name: Deploy web

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo build --release --target wasm32-unknown-unknown
      - name: Prepare site
        run: |
          mkdir site
          cp target/wasm32-unknown-unknown/release/castle_defense.wasm site/
          curl -L https://raw.githubusercontent.com/not-fl3/macroquad/master/js/mq_js_bundle.js -o site/mq_js_bundle.js
          cat > site/index.html <<'EOF'
          <!DOCTYPE html>
          <html><head><meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
          <title>Castle Defense</title>
          <style>html,body,canvas{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#000;position:absolute;touch-action:none}</style>
          </head><body>
          <canvas id="glcanvas" tabindex="1"></canvas>
          <script src="mq_js_bundle.js"></script>
          <script>load("castle_defense.wasm");</script>
          </body></html>
          EOF
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
